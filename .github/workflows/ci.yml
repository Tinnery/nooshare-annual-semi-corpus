name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      workspace_source_export:
        description: Export the exact source revision, tests and fixtures as an Actions artifact
        type: boolean
        default: false
      workspace_source_ref:
        description: Commit SHA, branch or tag to export (empty uses the workflow commit)
        type: string
        default: ""
        required: false

permissions:
  contents: read

jobs:
  unit-test:
    name: Unit tests (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run pytest -q

  infra-check:
    name: Infra check (stunnel tunnel)
    needs: unit-test
    # Run on push to main (single trusted agent writer) and manual dispatch.
    # Pull requests are excluded: fork PRs must never receive secrets, and
    # this job requires real infrastructure credentials. Re-evaluate if a
    # second writer or an untrusted contributor is ever added.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # NOOSHARE_INFRA is intentionally NOT set at job level: only the single
    # Prepare step below receives it, so checkout / setup-uv / install steps
    # never inherit the raw infrastructure secret.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install tunnel tools and project dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y stunnel4 jq
          uv sync --extra dev

      # Secret-handling rationale (keep this comment with the parsing step):
      # - NOOSHARE_INFRA is read only in-process by python3 via os.environ; the
      #   shell never interpolates it. No trace mode, no printing of secret
      #   values, and no JSON serialization of secrets into logs.
      # - GitHub masks the raw JSON secret, but NOT derived values such as the
      #   PSK hex or a DSN built from pg_password. Those are written exclusively
      #   into 0600 files under $RUNNER_TEMP/corpus-ci.
      # - The GitHub env-file mechanism is intentionally unused: it echoes values
      #   into job logs and persists them for later steps. The runtime env file
      #   is `source`d privately in the single step needing the credentials.
      - name: Prepare tunnel config, PSK file and private runtime env file
        # Secret scope is limited to this step only (least privilege).
        env:
          NOOSHARE_INFRA: ${{ secrets.NOOSHARE_INFRA }}
        run: |
          python3 - <<'PY'
          """Write tunnel material from NOOSHARE_INFRA; print no secret values."""
          import json
          import os
          import shlex
          from pathlib import Path
          from urllib.parse import quote

          work_dir = Path(os.environ["RUNNER_TEMP"]) / "corpus-ci"
          work_dir.mkdir(mode=0o700, parents=True, exist_ok=True)
          os.chmod(work_dir, 0o700)

          infra = json.loads(os.environ["NOOSHARE_INFRA"])

          def field(name: str) -> str:
              """Return a required non-empty string field, or fail closed."""
              value = infra.get(name)
              if not isinstance(value, str) or not value.strip():
                  raise SystemExit("NOOSHARE_INFRA: missing field " + name)
              return value.strip()

          stunnel_host = field("stunnel_host")
          psk_hex = field("stunnel_psk")
          pg_user = field("pg_user")
          pg_password = field("pg_password")
          pg_db = field("pg_db")
          access_key = field("rustfs_access_key")
          secret_key = field("rustfs_secret_key")
          bucket = field("rustfs_bucket")

          psk_file = work_dir / "k-ci.psk"
          # stunnel_psk is already the complete "identity:hex" form (k-ci:<64hex>).
          # Do NOT prepend the identity again or the PSK handshake will fail.
          psk_file.write_text(psk_hex + "\n", encoding="utf-8")
          os.chmod(psk_file, 0o600)

          pid_file = work_dir / "stunnel.pid"
          conf_file = work_dir / "stunnel.conf"
          # No debug/output directives: detailed stunnel logs must not be
          # emitted or filtered into Actions logs. Default (minimal) logging.
          conf_lines = [
              "pid = " + str(pid_file),
              "",
              "[pg]",
              "client = yes",
              "accept = 127.0.0.1:15432",
              "connect = " + stunnel_host + ":27002",
              "sni = pg.noos.com",
              "ciphers = PSK",
              "PSKsecrets = " + str(psk_file),
              "",
              "[rustfs]",
              "client = yes",
              "accept = 127.0.0.1:15500",
              "connect = " + stunnel_host + ":27002",
              "sni = rustfs.noos.com",
              "ciphers = PSK",
              "PSKsecrets = " + str(psk_file),
              "",
          ]
          conf_file.write_text("\n".join(conf_lines), encoding="utf-8")
          os.chmod(conf_file, 0o600)

          # URL-encode credentials so '@' or '/' in a password cannot break the DSN.
          dsn = (
              "postgresql://"
              + quote(pg_user, safe="")
              + ":"
              + quote(pg_password, safe="")
              + "@127.0.0.1:15432/"
              + quote(pg_db, safe="")
          )
          env_file = work_dir / "runtime.env"
          env_file.write_text(
              "\n".join([
                  "DATABASE_URL=" + shlex.quote(dsn),
                  "RUSTFS_ENDPOINT_URL=" + shlex.quote("http://127.0.0.1:15500"),
                  "RUSTFS_ACCESS_KEY=" + shlex.quote(access_key),
                  "RUSTFS_SECRET_KEY=" + shlex.quote(secret_key),
                  "CORPUS_RUSTFS_BUCKET=" + shlex.quote(bucket),
                  "",
              ]),
              encoding="utf-8",
          )
          os.chmod(env_file, 0o600)
          PY

      - name: Start stunnel
        run: |
          work_dir="$RUNNER_TEMP/corpus-ci"
          stunnel_bin="$(command -v stunnel || command -v stunnel4)"
          "$stunnel_bin" "$work_dir/stunnel.conf"
          for _ in $(seq 1 30); do
            if [ -s "$work_dir/stunnel.pid" ]; then
              break
            fi
            sleep 1
          done
          test -s "$work_dir/stunnel.pid"

      # Do NOT probe with /dev/tcp here: each probe opens a real TLS session
      # through the CI SNI router, consuming a scarce remote connection slot.
      # Checking stunnel's own local listeners is enough (no remote handshake).
      - name: Wait for tunnel listeners
        run: |
          for port in 15432 15500; do
            ready=0
            for _ in $(seq 1 30); do
              if ss -ltn 2>/dev/null | grep -q "127.0.0.1:$port"; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "stunnel listener $port not ready after 30s" >&2
              exit 1
            fi
          done

      - name: Run corpus check through tunnel
        run: |
          set -a
          # shellcheck disable=SC1090
          source "$RUNNER_TEMP/corpus-ci/runtime.env"
          set +a
          # This is a public repository: Actions logs are public. Keep the
          # corpus gap detail (missing object keys / internal data state) out
          # of the log; capture full output privately and echo only counts.
          out="$RUNNER_TEMP/corpus-ci/check.out"
          status=0
          uv run nooshare-annual-semi-corpus check --year-min 2020 > "$out" 2>&1 || status=$?
          # Echo only aggregate counts / error lines; corpus gap keys stay private.
          grep -E "check 摘要|schema |期望对象数|实有对象数|缺失数|孤儿数|内容检查|命中对象数|正文抽样数|样本分组数|已尝试读取|样本可读取|样本无问题|样本未识别年度|内容问题|invalid_utf8|empty|too_short|stub_content|error_page|truncated|year_mismatch|period_mismatch|stock_code_mismatch|annual_terminal|annual_tail_drift|read_error|错误" "$out" || true
          exit "$status"

      - name: Stop stunnel and remove secret material
        if: always()
        run: |
          work_dir="$RUNNER_TEMP/corpus-ci"
          pid_file="$work_dir/stunnel.pid"
          if [ -s "$pid_file" ]; then
            pid="$(cat "$pid_file")"
            if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
            fi
          fi
          rm -f "$pid_file" "$work_dir/stunnel.conf" "$work_dir/k-ci.psk" "$work_dir/runtime.env" "$work_dir/check.out"

  workspace_source_export:
    name: Workspace Source Export
    if: github.event_name == 'workflow_dispatch' && inputs.workspace_source_export == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the requested source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.workspace_source_ref || github.sha }}
          fetch-depth: 0

      - name: Package tracked source, tests and fixtures
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import os
          import subprocess
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          repository = os.environ["GITHUB_REPOSITORY"]
          records = []
          excluded = []
          max_file_bytes = 50 * 1024 * 1024

          excluded_segments = {
              ".git", ".venv", "venv", "__pycache__", ".pytest_cache",
              ".mypy_cache", ".ruff_cache", ".runtime", ".generated",
              ".cache", "node_modules",
          }
          third_party_binary_dirs = {
              "third_party/bin", "third_party/binaries",
              "third-party/bin", "third-party/binaries",
              "offline-binaries", "offline-third-party",
          }
          tdx_raw_dirs = {
              "tdx/raw", "tdx/raw_data", "tdx/raw-data",
              "data/tdx/raw", "data/tdx/raw_data", "data/tdx/raw-data",
          }

          entries = subprocess.check_output(
              ["git", "ls-files", "-s", "-z"]
          ).split(b"\0")

          for entry in entries:
              if not entry:
                  continue
              metadata, raw_path = entry.split(b"\t", 1)
              mode, _blob, _stage = metadata.decode("ascii").split()
              path = raw_path.decode("utf-8", errors="strict")
              rel = PurePosixPath(path)
              parts = tuple(part.lower() for part in rel.parts)
              reason = None

              if mode == "160000":
                  reason = "git-submodule-pointer"
              elif any(part in excluded_segments for part in parts):
                  reason = "generated-or-dependency-directory"
              elif any(
                  "/".join(parts[i:i + 2]) in third_party_binary_dirs
                  for i in range(max(0, len(parts) - 1))
              ):
                  reason = "offline-third-party-binary"
              elif any(
                  "/".join(parts[i:i + 2]) in tdx_raw_dirs
                  for i in range(max(0, len(parts) - 1))
              ):
                  reason = "tdx-raw-data"

              source = root.joinpath(*rel.parts)
              if reason is None and not source.is_file():
                  reason = "not-a-regular-file"
              if reason is None and source.stat().st_size > max_file_bytes:
                  reason = "file-over-50-mib"

              if reason:
                  excluded.append({"path": path, "reason": reason})
                  continue

              data = source.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              file_mode = 0o755 if mode.endswith("755") else 0o644
              records.append({
                  "path": path,
                  "size": len(data),
                  "sha256": digest,
                  "mode": oct(file_mode),
              })

          records.sort(key=lambda item: item["path"])
          excluded.sort(key=lambda item: item["path"])
          manifest = {
              "schema_version": 1,
              "repository": repository,
              "commit": commit,
              "file_count": len(records),
              "fixture_file_count": sum(
                  1 for item in records
                  if any(
                      marker in part.lower()
                      for part in PurePosixPath(item["path"]).parts
                      for marker in ("test", "fixture", "sample")
                  )
              ),
              "files": records,
              "excluded_file_count": len(excluded),
              "excluded": excluded,
              "exclusion_policy": {
                  "max_file_bytes": max_file_bytes,
                  "purpose": "exclude generated dependencies, offline third-party binaries and large raw assets while retaining tracked tests and fixtures",
              },
          }
          manifest_bytes = json.dumps(
              manifest, ensure_ascii=False, sort_keys=True, indent=2
          ).encode("utf-8")

          output_dir = Path(os.environ["RUNNER_TEMP"])
          archive_path = output_dir / "workspace-source.tar.gz"
          manifest_path = output_dir / "workspace-source-manifest.json"

          with tarfile.open(archive_path, "w:gz", compresslevel=6) as archive:
              for item in records:
                  data = root.joinpath(*PurePosixPath(item["path"]).parts).read_bytes()
                  info = tarfile.TarInfo(item["path"])
                  info.size = len(data)
                  info.mode = int(item["mode"], 8)
                  info.mtime = 0
                  archive.addfile(info, io.BytesIO(data))

              info = tarfile.TarInfo("WORKSPACE-MANIFEST.json")
              info.size = len(manifest_bytes)
              info.mode = 0o644
              info.mtime = 0
              archive.addfile(info, io.BytesIO(manifest_bytes))

          manifest_path.write_bytes(manifest_bytes)
          archive_hash = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          print(json.dumps({
              "status": "EXPORTED",
              "repository": repository,
              "commit": commit,
              "files": len(records),
              "fixture_files": manifest["fixture_file_count"],
              "excluded": len(excluded),
              "archive_bytes": archive_path.stat().st_size,
              "archive_sha256": archive_hash,
          }, sort_keys=True))
          PY

      - name: Upload exact source artifact
        uses: actions/upload-artifact@v4
        with:
          name: workspace-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/workspace-source.tar.gz
            ${{ runner.temp }}/workspace-source-manifest.json
          if-no-files-found: error
          retention-days: 3

  workspace_artifact_materialization:
    name: Workspace Artifact Materialization
    needs: workspace_source_export
    if: needs.workspace_source_export.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download source artifact
        uses: actions/download-artifact@v4
        with:
          name: workspace-source-${{ github.run_id }}
          path: ${{ runner.temp }}/workspace-source-artifact

      - name: Materialize and verify Python workspace snapshot
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import tarfile
          from pathlib import Path, PurePosixPath

          artifact_dir = Path("${{ runner.temp }}") / "workspace-source-artifact"
          archive_path = artifact_dir / "workspace-source.tar.gz"
          manifest_path = artifact_dir / "workspace-source-manifest.json"
          destination = Path("${{ runner.temp }}") / "materialized-python-workspace"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          destination.mkdir(parents=True, exist_ok=True)

          with tarfile.open(archive_path, "r:gz") as archive:
              members = {member.name: member for member in archive.getmembers()}
              embedded = members.get("WORKSPACE-MANIFEST.json")
              if embedded is None or not embedded.isfile():
                  raise SystemExit("materialization failed: embedded manifest missing")
              embedded_manifest = archive.extractfile(embedded).read()
              if embedded_manifest != manifest_path.read_bytes():
                  raise SystemExit("materialization failed: manifest mismatch")

              for item in manifest["files"]:
                  path = PurePosixPath(item["path"])
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit("materialization failed: unsafe archive path")
                  member = members.get(item["path"])
                  if member is None or not member.isfile():
                      raise SystemExit("materialization failed: source member missing")
                  data = archive.extractfile(member).read()
                  if len(data) != item["size"]:
                      raise SystemExit("materialization failed: file size mismatch")
                  if hashlib.sha256(data).hexdigest() != item["sha256"]:
                      raise SystemExit("materialization failed: file hash mismatch")

                  target = destination.joinpath(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  target.chmod(int(item["mode"], 8))

          materialized_count = sum(
              1 for path in destination.rglob("*") if path.is_file()
          )
          if materialized_count != manifest["file_count"]:
              raise SystemExit("materialization failed: file count mismatch")

          print(json.dumps({
              "status": "MATERIALIZED_AND_VERIFIED",
              "repository": manifest["repository"],
              "commit": manifest["commit"],
              "files": materialized_count,
              "fixture_files": manifest["fixture_file_count"],
          }, sort_keys=True))
          PY
